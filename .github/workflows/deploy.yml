# Builds the app and publishes it to GitHub Pages on every push to main:
# https://bitopiit-dev.github.io/Cricket_Score_Board/
# Tests, type-check and lint must pass, otherwise nothing is deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          
      - run: npm ci
      - run: npm run lint
      - run: npm test
      
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Browser tests: every public page in both themes (script errors, WCAG 2 AA
      # checks, no sideways scrolling at 320px) and the main flows. Run against a
      # build without Supabase keys, so they never depend on live data.
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build for browser tests
        run: npm run build
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          
      - name: Build
      - name: Build
        run: npm run build
        env:
          # Supabase (from step B on). Set these under Settings → Secrets and
          # variables → Actions → Variables. Only the URL and the publishable key:
          # never a service_role or secret key.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
