<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BPL-2027 · দর্শকের স্কোরকার্ড (ডেমো)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  /* page around the phone (follows the viewer's theme) */
  --page:#e9edf4;--page-ink:#0f172a;--page-sub:#475569;--frame:#0b0f1a;
  /* the app itself is always dark: these match the real app */
  --app:#0b1120;--night:#0f172a;--card:#1e293b;--chip:#2a3a52;--line:#334155;--muted:#94a3b8;--ink:#f8fafc;
  --red:#e11d48;--green:#10b981;--gold:#f59e0b;--cyan:#06b6d4;
  --sans:'Hind Siliguri',ui-sans-serif,system-ui,sans-serif;--display:'Barlow Condensed','Hind Siliguri','Arial Narrow',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#05070d;--page-ink:#e2e8f0;--page-sub:#94a3b8;--frame:#1a2232;color-scheme:dark}}
:root[data-theme="dark"]{--page:#05070d;--page-ink:#e2e8f0;--page-sub:#94a3b8;--frame:#1a2232;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--page);color:var(--page-ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px 20px}
.note{max-width:300px}
.note h1{font-family:var(--display);font-weight:900;font-size:44px;line-height:.95;margin:0 0 14px;letter-spacing:.5px}
.note p{margin:0 0 12px;color:var(--page-sub);line-height:1.6;font-size:15px}
.note .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.note button{font:600 14px var(--sans);border-radius:999px;border:1px solid color-mix(in srgb,var(--page-ink) 25%,transparent);background:transparent;color:var(--page-ink);padding:8px 14px;cursor:pointer}
.note button:focus-visible,.app button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.phone{width:390px;height:844px;border-radius:54px;background:var(--frame);padding:12px;box-shadow:0 30px 80px rgb(0 0 0/.35),inset 0 0 0 2px rgb(255 255 255/.06);flex:none}
.app{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--app);color:var(--ink);display:flex;flex-direction:column}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;z-index:30}
@media (max-width:760px){
  .stage{padding:0;display:block}.note{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--app)}
  .app{border-radius:0}.island{display:none}
}
/* --- app --- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:10px;padding:46px 14px 10px;background:var(--app)}
@media (max-width:760px){.top{padding-top:calc(10px + env(safe-area-inset-top,0px))}}
.top .back{font-size:26px;color:var(--ink);opacity:.9;width:28px;text-align:center;line-height:1}
.top .title{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:transparent;border:0;color:var(--ink);cursor:pointer}
.lang{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgb(255 255 255/.35);background:transparent;color:var(--ink);font:700 15px var(--sans);cursor:pointer}
.hero{position:relative;padding:14px 12px 16px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;top:-40px;width:260px;height:260px;border-radius:50%;filter:blur(36px);opacity:.55}
.hero::before{left:-90px;background:var(--ca)}.hero::after{right:-90px;background:var(--cb)}
.sides{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:4px;z-index:1}
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.logo{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 18px rgb(0 0 0/.35)}
.logo img{width:86%;height:86%;object-fit:contain}
.side .nm{font-weight:600;font-size:15px;line-height:1.2;margin-top:4px}
.side .sc{font-family:var(--display);font-weight:900;font-size:44px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.side .ov{font-size:12px;color:rgb(255 255 255/.75)}
.side.wait .sc{font-size:22px;opacity:.6;padding-top:12px}
.livepill{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:#fff;color:#fff}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ring 1.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.chase{position:relative;z-index:1;text-align:center;margin-top:14px}
.chase .need{font-weight:700;font-size:21px}
.chase .rates{display:flex;justify-content:center;gap:18px;font-size:13px;color:rgb(255 255 255/.8);margin-top:6px;font-variant-numeric:tabular-nums}
.result{color:var(--gold);font-family:var(--display);font-weight:800;font-size:28px}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--app);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;color:var(--muted);font:600 16px var(--sans);padding:12px 0 10px;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:3px;border-radius:3px;background:var(--red)}
.pane{padding:14px 0 56px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);outline:1px solid rgb(148 163 184/.14);outline-offset:-1px;border-radius:16px;margin:0 12px;padding:12px 14px}
.card h3{font-family:var(--display);font-weight:800;font-size:24px;margin:2px 0 10px;letter-spacing:.3px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;font-size:13px;color:var(--muted);text-align:right;padding:6px 4px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;font-size:15px;border-top:1px solid rgb(51 65 85/.6)}
td.b{font-weight:700}
td .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.striker{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.gold{display:inline-block;margin-left:6px;background:var(--gold);color:#0b1120;border-radius:999px;padding:0 6px;font-size:11px;font-weight:800;line-height:1.5;vertical-align:2px;box-shadow:0 0 8px rgb(245 158 11/.35)}
.batting{color:var(--green)}
.balls{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.ball{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.ball.zero{background:transparent;color:var(--muted)}
.ball.four{background:var(--cyan);color:#0b1120;box-shadow:none}
.ball.six{background:var(--gold);color:#0b1120;box-shadow:none}
.ball.w{background:var(--red);color:#fff;box-shadow:none}
.ball.ex{background:#78350f;color:#fde68a;box-shadow:none;font-size:11px}
.ball.new{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.overrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgb(51 65 85/.6)}
.overrow:first-of-type{border-top:0}
.overrow .ball{width:30px;height:30px;font-size:12px}
.overrow .balls{gap:4px}
.overrow .lab{width:64px;flex:none;font-weight:600;font-size:14px;line-height:1.2}
.overrow .lab small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.overrow .tot{margin-left:auto;font-family:var(--display);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.waiting{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.inn{background:var(--card);margin:0;border-radius:0;padding:0}
.innhead{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;background:var(--night)}
.innhead b{font-size:17px}.innhead span{font-family:var(--display);font-weight:900;font-size:24px}
.inn table td,.inn table th{padding-left:16px;padding-right:16px}
.inn table td+td,.inn table th+th{padding-left:4px;padding-right:4px}
.inn table td:last-child,.inn table th:last-child{padding-right:16px}
.extras{padding:10px 16px;color:var(--muted);font-size:14px;border-top:1px solid rgb(51 65 85/.6)}
.fow{padding:10px 16px 14px;font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid rgb(51 65 85/.6)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
svg text{font-family:var(--sans)}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
.burst span{font-family:var(--display);font-weight:900;font-size:86px;letter-spacing:2px;-webkit-text-stroke:3px #0b1120;paint-order:stroke;animation:burst 1.3s cubic-bezier(.2,1.2,.3,1) forwards}
.burst.four span{color:var(--cyan);text-shadow:0 0 30px rgb(6 182 212/.7)}
.burst.six span{color:var(--gold);text-shadow:0 0 30px rgb(245 158 11/.8)}
.burst.w span{color:#fff;background:var(--red);padding:0 18px;border-radius:14px;-webkit-text-stroke:0;text-shadow:none;box-shadow:0 0 40px rgb(225 29 72/.7)}
@keyframes burst{0%{transform:scale(.3) rotate(-6deg);opacity:0}25%{transform:scale(1.12) rotate(0);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
.donecard{text-align:center}
.donecard button{margin-top:10px;font:700 15px var(--sans);background:var(--gold);color:#0b1120;border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
.demo-tag{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgb(15 23 42/.9);border:1px solid var(--line);color:var(--muted);font-size:11px;border-radius:999px;padding:3px 10px;z-index:20;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.dot::after,.waiting,.ball.new{animation:none}.burst span{animation-duration:.01s}}
</style>
</head>
<body>
<div class="stage">
  <section class="note" aria-label="ডেমো সম্পর্কে">
    <h1 id="noteTitle">দর্শকের ফোনে লাইভ স্কোর</h1>
    <p id="noteP1">BPL-2027 অ্যাপের Match Center যেভাবে দর্শকের ফোনে দেখায়: উদ্বোধনী ম্যাচ, Red Bulls Warriors বনাম Rainbow Cutting। খেলা নিজে নিজে বল-বাই-বল এগোচ্ছে।</p>
    <p id="noteP2">স্কোর, খেলোয়াড় আর ফল সবই নমুনা। আসল ম্যাচে স্কোরার যা লেখেন, দর্শক সেটাই সঙ্গে সঙ্গে দেখেন।</p>
    <div class="ctl">
      <button id="pauseBtn" type="button">থামান</button>
      <button id="fastBtn" type="button">দ্রুত চালান</button>
      <button id="restartBtn" type="button">শুরু থেকে</button>
    </div>
  </section>
  <div class="phone"><div class="app" id="app">
    <div class="island" aria-hidden="true"></div>
    <div class="scroll" id="scroll">
      <header class="top">
        <span class="back" aria-hidden="true">‹</span>
        <div class="title" id="title"></div>
        <button class="iconbtn" type="button" id="shareBtn" aria-label="শেয়ার"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/></svg></button>
        <button class="lang" type="button" id="langBtn">EN</button>
      </header>
      <section class="hero" id="hero" style="--ca:#b91c1c;--cb:#db2777"></section>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div id="pane" class="pane" role="tabpanel"></div>
    </div>
    <div class="demo-tag" id="demoTag">ডেমো · নমুনা স্কোর</div>
  </div></div>
</div>

function pickBowler(inn,rand){
  const F=TEAMS[inn.bowl].players.slice(5);/* the bowlers: lower order */

    if(inn.legal<OVERS*6&&!allOut&&!chased){inn.overs.push([]);[inn.striker,inn.non]=[inn.non,inn.striker]}
  }
  if(allOut||chased||inn.legal>=OVERS*6){inn.done=true;if(inn.legal%6)inn.worm.push(inn.runs)}
  return ev;
}

/* ---------- the demo match ---------- */
let S;
function setup(){
  const rand=rng(2027);
  const i1=newInnings(0,1);
  while(!i1.done)bowl(i1,rand,null);
  const i2=newInnings(1,0);
  const target=i1.runs+1;
  while(i2.legal<36&&!i2.done)bowl(i2,rand,target);/* start the live part at 6 overs */
  S={i1,i2,target,rand,last:null,speed:1,paused:false,timer:null};
}
function result(){
  const {i1,i2,target}=S;if(!i2.done)return null;
  if(i2.runs>=target)return L().won(TEAMS[1].name,L().byWk(n(10-i2.wk)));
  if(i2.runs===target-1)return L().tie;
  return L().won(TEAMS[0].name,L().byRuns(n(target-1-i2.runs)));
}

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
let tab=0;
function ballCls(e){return e.kind==='w'?'w':e.kind==='wd'?'ex':e.runs===4?'four':e.runs===6?'six':e.runs===0?'zero':''}
function ballTxt(e){return e.kind==='w'?'W':e.kind==='wd'?L().wide:e.runs===0?'•':n(e.runs)}
function ballsHTML(list,newest){return list.map((e,i)=>`<span class="ball ${ballCls(e)} ${newest&&i===list.length-1?'new':''}">${ballTxt(e)}</span>`).join('')}
function overRuns(o){return o.reduce((a,e)=>a+(e.kind==='w'?0:e.runs),0)}
function dismissal(o){const l=L();return o.how==='caught'?l.caught(o.bowler,o.fielder):o.how==='bowled'?l.bowled(o.bowler):o.how==='lbw'?l.lbw(o.bowler):l.runout(o.fielder)}
function sr(b){return b.b?dec(b.r*100/b.b,1):'—'}

function renderHero(){
  const {i1,i2,target}=S,l=L();const res=result();
  const side=(ti,inn,live)=>`<div class="side"><div class="logo"><img src="${TEAMS[ti].logo}" alt=""></div><div class="nm" lang="en">${TEAMS[ti].name}</div>
    <div class="sc">${n(inn.runs)}/${n(inn.wk)}</div><div class="ov">${ov(inn.legal)} ${l.overs}</div></div>`;
  const ballsLeft=OVERS*6-i2.legal,need=target-i2.runs;
  const rrr=ballsLeft?need*6/ballsLeft:0;
  $('hero').innerHTML=`<div class="sides">${side(0,i1)}<div>${res?'':`<span class="livepill"><span class="dot"></span>${l.live}</span>`}</div>${side(1,i2)}</div>
    <div class="chase">${res?`<div class="result">${res}</div>`:`<div class="need">${l.need(n(need),n(ballsLeft))}</div>`}
    <div class="rates"><span>${l.crr} ${dec(i2.legal?i2.runs*6/i2.legal:0)}</span><span>${l.target} ${n(target)}</span>${res?'':`<span>${l.rrr} ${dec(rrr)}</span>`}</div></div>`;
  $('title').textContent=`${TEAMS[0].name} ${l.vs} ${TEAMS[1].name}`;
}
function renderTabs(){
  $('tabs').innerHTML=L().tabs.map((t,i)=>`<button role="tab" type="button" aria-selected="${i===tab}" data-i="${i}">${t}</button>`).join('');
}
function summary(newest){
  const {i2}=S,l=L();const res=result();
  const bats=[i2.striker,i2.non].filter(i=>i>=0&&i<11).map(i=>i2.batters[i]);
  const oi=i2.overs.length-1;const cur=i2.overs[oi];const bw=i2.bowlers[i2.overBowler[oi]];
  const lastW=i2.fow[i2.fow.length-1];const pRuns=i2.runs-(lastW?lastW.runs:0);
  const pBalls=i2.legal-(lastW?lastW.over:0);
  const recent=i2.overs.map((o,i)=>({o,i})).filter(x=>x.o.length).reverse().slice(res?0:1,res?5:6);
  const top=[S.i1,S.i2].map(inn=>{const b=[...inn.batters].sort((a,c)=>c.r-a.r)[0];const w=Object.values(inn.bowlers).sort((a,c)=>c.w-a.w||a.r-c.r)[0];return{b,w,bat:inn.bat,bowl:inn.bowl}});
  return `${res?`<div class="card donecard"><h3>${res}</h3><button type="button" data-act="again">${l.again}</button></div>`:`<div class="card">
    <table><thead><tr><th>${l.batter}</th><th>${l.r}</th><th>${l.b}</th><th>${l.f4}</th><th>${l.f6}</th><th>${l.sr}</th></tr></thead><tbody>
    ${bats.map((b,k)=>`<tr><td class="b">${k===0?'<span class="striker"></span>':''}${b.name}${b.r>=50?`<span class="gold">${n(b.r>=100?100:50)}</span>`:''}</td><td class="b">${n(b.r)}</td><td>${n(b.b)}</td><td>${n(b.f)}</td><td>${n(b.s)}</td><td>${sr(b)}</td></tr>`).join('')}
    </tbody></table>
    <table style="margin-top:6px"><thead><tr><th>${l.bowler}</th><th>${l.o}</th><th>${l.r}</th><th>${l.w}</th><th>${l.eco}</th></tr></thead><tbody>
    ${bw?`<tr><td>${bw.name}</td><td>${ov(bw.legal)}</td><td>${n(bw.r)}</td><td>${n(bw.w)}</td><td>${bw.legal?dec(bw.r*6/bw.legal):'—'}</td></tr>`:''}</tbody></table>
    <div style="color:var(--muted);font-size:14px;margin:8px 0 10px">${l.partnership}: ${n(pRuns)} (${n(pBalls)})</div>
    <div class="balls"><span style="color:var(--muted);font-size:13px;width:52px">${l.over} ${n(oi+1)}</span>${ballsHTML(cur,newest)}<span style="margin-left:auto;font-weight:700">= ${n(overRuns(cur))}</span></div>
    <div class="waiting">${l.waiting}</div></div>`}
    <div class="card"><h3>${l.recent}</h3>${recent.map(({o,i})=>`<div class="overrow"><div class="lab">${l.over} ${n(i+1)}<small>${i2.overBowler[i]}</small></div><div class="balls">${ballsHTML(o.slice(-6))}</div><div class="tot">${n(overRuns(o))}</div></div>`).join('')}</div>`;
}
function innCard(inn,num){
  const l=L();const live=inn===S.i2&&!inn.done;
  const rows=inn.batters.filter(b=>b.in||b.out).map((b,k)=>{
    const atCrease=live&&!b.out&&(inn.batters.indexOf(b)===inn.striker||inn.batters.indexOf(b)===inn.non);
    const how=b.out?dismissal(b.out):atCrease?`<span class="batting">${l.batting}</span>`:l.notOut;
    return `<tr><td><b class="${atCrease?'batting':''}">${b.name}${atCrease&&inn.batters.indexOf(b)===inn.striker?' *':''}</b>${b.r>=50?`<span class="gold">${n(b.r>=100?100:50)}</span>`:''}<span class="sub">${how}</span></td><td class="b">${n(b.r)}</td><td>${n(b.b)}</td><td>${n(b.f)}</td><td>${n(b.s)}</td><td>${sr(b)}</td></tr>`}).join('');
  const bw=Object.values(inn.bowlers).map(b=>`<tr><td>${b.name}${b.w>=3?`<span class="gold">${n(b.w)} ${lang==='bn'?'উই':'W'}</span>`:''}</td><td>${ov(b.legal)}</td><td>${n(b.r)}</td><td>${n(b.w)}</td><td>${b.legal?dec(b.r*6/b.legal):'—'}</td></tr>`).join('');
  return `<section class="inn"><div class="innhead"><b lang="en">${TEAMS[inn.bat].name} <small style="color:var(--muted);font-weight:400">${l.inns} ${n(num)}</small></b><span>${n(inn.runs)}/${n(inn.wk)} <small style="font-size:15px;color:var(--muted)">(${ov(inn.legal)})</small></span></div>
    <table><thead><tr><th>${l.batter}</th><th>${l.r}</th><th>${l.b}</th><th>${l.f4}</th><th>${l.f6}</th><th>${l.sr}</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="extras">${l.extras}: ${n(inn.extras)}</div>
    <table><thead><tr><th>${l.bowler}</th><th>${l.o}</th><th>${l.r}</th><th>${l.w}</th><th>${l.eco}</th></tr></thead><tbody>${bw}</tbody></table>
    ${inn.fow.length?`<div class="fow"><b style="color:var(--ink)">${l.fow}:</b> ${inn.fow.map(f=>`${n(f.runs)}-${n(f.wk)} (${f.name}, ${ov(f.over)})`).join(', ')}</div>`:''}</section>`;
}
function scorecard(){return innCard(S.i2,2)+innCard(S.i1,1)}
function oversTab(newest){
  const l=L();const inn=S.i2;
  return `<div class="card"><h3 lang="en">${TEAMS[1].name}</h3>${inn.overs.map((o,i)=>({o,i})).filter(x=>x.o.length).reverse().map(({o,i},k)=>`<div class="overrow"><div class="lab">${l.over} ${n(i+1)}<small>${inn.overBowler[i]}</small></div><div class="balls">${ballsHTML(o.slice(-6),newest&&k===0)}</div><div class="tot">${n(overRuns(o))}</div></div>`).join('')}</div>`;
}
function graphs(){
  const l=L();const C1='#f59e0b',C2='#06b6d4';const W=340,H=190,P=28;const max=Math.max(S.i1.runs,S.target,S.i2.runs)+10;
  const x=i=>P+i*(W-P-8)/OVERS,y=r=>H-22-r*(H-40)/max;
  const line=(w,c)=>`<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${w.map((r,i)=>`${x(i)},${y(r)}`).join(' ')}"/>`+w.map((r,i)=>i?`<circle cx="${x(i)}" cy="${y(r)}" r="3" fill="${c}"/>`:'').join('');
  const grid=[0,.25,.5,.75,1].map(f=>{const r=Math.round(max*f/10)*10;return`<line x1="${P}" x2="${W-8}" y1="${y(r)}" y2="${y(r)}" stroke="#334155" stroke-dasharray="3 4"/><text x="${P-6}" y="${y(r)+4}" fill="#94a3b8" font-size="10" text-anchor="end">${n(r)}</text>`}).join('');
  const xt=[0,3,6,9,12].map(o=>`<text x="${x(o)}" y="${H-6}" fill="#94a3b8" font-size="10" text-anchor="middle">${n(o)}</text>`).join('');
  const per=inn=>inn.overs.map(overRuns);const a=per(S.i1),b=per(S.i2);const mx=Math.max(...a,...b,6);
  const bw=(W-P-8)/OVERS;const by=r=>H-22-r*(H-40)/mx;
  const bars=[...Array(OVERS)].map((_,i)=>`${a[i]!=null?`<rect x="${P+i*bw+2}" y="${by(a[i])}" width="${bw/2-3}" height="${H-22-by(a[i])}" rx="2" fill="${C1}"/>`:''}${b[i]!=null?`<rect x="${P+i*bw+bw/2}" y="${by(b[i])}" width="${bw/2-3}" height="${H-22-by(b[i])}" rx="2" fill="${C2}"/>`:''}`).join('');
  const legend=`<div class="legend"><span><i style="background:${C1}"></i>${TEAMS[0].name}</span><span><i style="background:${C2}"></i>${TEAMS[1].name}</span></div>`;
  return `<div class="card"><h3>${l.worm}</h3>${legend}<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${l.worm}">${grid}${xt}${line(S.i1.worm,C1)}${line(S.i2.worm,C2)}</svg></div>
    <div class="card"><h3>${l.manhattan}</h3>${legend}<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${l.manhattan}"><line x1="${P}" x2="${W-8}" y1="${H-22}" y2="${H-22}" stroke="#334155"/>${bars}${xt}</svg></div>`;
}
function render(newest){
  renderHero();renderTabs();
  $('pane').innerHTML=[summary,scorecard,oversTab,graphs][tab](newest);
  document.documentElement.lang=lang;
  $('langBtn').textContent=lang==='bn'?'EN':'বাং';
  $('demoTag').textContent=L().demo;
  $('noteTitle').textContent=L().noteTitle;$('noteP1').textContent=L().noteP1;$('noteP2').textContent=L().noteP2;
  $('pauseBtn').textContent=S.paused?L().play:L().pause;$('fastBtn').textContent=S.speed>1?L().normal:L().fast;$('restartBtn').textContent=L().restart;
}
function burst(e){
  const k=e.kind==='w'?'w':e.runs===6?'six':e.runs===4?'four':null;if(!k)return;
  const d=document.createElement('div');d.className='burst '+k;d.innerHTML=`<span>${k==='w'?L().wicket:k==='six'?L().six:L().four}</span>`;
  $('hero').appendChild(d);setTimeout(()=>d.remove(),1400);
}
function step(){
  if(S.paused||S.i2.done)return;
  const e=bowl(S.i2,S.rand,S.target);render(true);if(e)burst(e);
  if(!S.i2.done)S.timer=setTimeout(step,(e&&(e.kind==='w'||e.runs>=4)?2600:1900)/S.speed);
}
function start(){clearTimeout(S?.timer);setup();render(false);S.timer=setTimeout(step,1500)}

$('tabs').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;tab=+b.dataset.i;render(false)});
$('pane').addEventListener('click',ev=>{if(ev.target.closest('[data-act="again"]'))start()});
$('langBtn').addEventListener('click',()=>{lang=lang==='bn'?'en':'bn';render(false)});
$('pauseBtn').addEventListener('click',()=>{S.paused=!S.paused;clearTimeout(S.timer);if(!S.paused)S.timer=setTimeout(step,500);render(false)});
$('fastBtn').addEventListener('click',()=>{S.speed=S.speed>1?1:3;render(false)});
$('restartBtn').addEventListener('click',start);
$('shareBtn').addEventListener('click',async()=>{
  const r=result();const t=`${TEAMS[0].name} ${n(S.i1.runs)}/${n(S.i1.wk)} · ${TEAMS[1].name} ${n(S.i2.runs)}/${n(S.i2.wk)} (${ov(S.i2.legal)})${r?' · '+r:''}`;
  try{await navigator.clipboard.writeText(t);$('demoTag').textContent=L().copied;setTimeout(()=>$('demoTag').textContent=L().demo,1800)}catch{}
});
start();
</script>
</body>
</html>
