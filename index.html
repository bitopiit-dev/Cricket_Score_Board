<!doctype html>
<html lang="bn" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <script>
      // Sunlight mode: switch before first paint so the page doesn't flash dark
      try {
        if (JSON.parse(localStorage.getItem('csb-prefs')).state.theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch {
        /* no saved preference */
      }
    </script>
    <title>BPL-2027 | Baridhi Premier League-2027</title>
    <meta
      name="description"
      content="Baridhi Premier League-2027: লাইভ স্কোর, সূচি আর পয়েন্ট টেবিল। ১৭ নভেম্বর থেকে ১৯ ডিসেম্বর ২০২৬।"
    />
    <!-- Link previews (WhatsApp, Facebook, Messenger): image URLs must be absolute -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BPL-2027" />
    <meta property="og:title" content="Baridhi Premier League-2027" />
    <meta
      property="og:description"
      content="লাইভ স্কোর, সূচি আর পয়েন্ট টেবিল। ১৭ নভেম্বর থেকে ১৯ ডিসেম্বর ২০২৬।"
    />
    <meta property="og:url" content="https://bitopiit-dev.github.io/Cricket_Score_Board/" />
    <meta
      property="og:image"
      content="https://bitopiit-dev.github.io/Cricket_Score_Board/images/og-share.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BPL-2027 logo with the league name and dates" />
    <meta property="og:locale" content="bn_BD" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="BPL-2027" />
  </head>
  <body>
    <div id="root">
      <!--
        Start-up skeleton: shown before the app's script has loaded, shaped like
        the Home page (header, scoreboard card, two cards, tab bar) so nothing
        jumps when React replaces it.
      -->
      <div class="boot">
        <div class="boot-head">
          <img src="/images/bpl-2027-logo-v2.webp" alt="BPL-2027" width="72" height="44" />
          <span class="boot-bone" style="width: 150px; height: 18px"></span>
          <span class="boot-bone" style="width: 44px; height: 32px; border-radius: 999px"></span>
        </div>
        <div class="boot-body">
          <div class="boot-card boot-hero">
            <span class="boot-bone" style="width: 40%; height: 12px"></span>
            <div class="boot-row">
              <span class="boot-bone boot-round"></span>
              <span class="boot-bone" style="width: 40px; height: 20px"></span>
              <span class="boot-bone boot-round"></span>
            </div>
            <span class="boot-bone" style="height: 52px"></span>
          </div>
          <div class="boot-card">
            <span class="boot-bone" style="width: 55%; height: 18px"></span>
            <span class="boot-bone" style="height: 10px"></span>
            <span class="boot-bone" style="width: 80%; height: 10px"></span>
          </div>
          <div class="boot-card">
            <span class="boot-bone" style="width: 45%; height: 18px"></span>
            <span class="boot-bone" style="height: 10px"></span>
          </div>
        </div>
      </div>
      <style>
        .boot {
          position: fixed;
          inset: 0;
          background: #0b1120;
          display: flex;
          flex-direction: column;
        }
        .boot-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
        }
        .boot-head img {
          width: 72px;
          height: auto;
        }
        .boot-body {
          display: flex;
          flex-direction: column;
          gap: 16px;
          width: 100%;
          max-width: 32rem;
          margin: 0 auto;
          padding: 16px;
          box-sizing: border-box;
        }
        .boot-card {
          display: flex;
          flex-direction: column;
          gap: 12px;
          padding: 20px;
          border-radius: 16px;
          background: #1e293b;
          outline: 1px solid rgb(148 163 184 / 0.14);
        }
        .boot-hero {
          border-radius: 24px;
          background: #0f172a;
          gap: 18px;
        }
        .boot-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .boot-round {
          width: 64px;
          height: 64px;
          border-radius: 999px !important;
        }
        .boot-bone {
          display: block;
          border-radius: 8px;
          background: linear-gradient(90deg, #2a3a52 0%, #3b4b66 50%, #2a3a52 100%) 0 0 / 200% 100%;
          animation: boot-shimmer 1.3s linear infinite;
        }
        @keyframes boot-shimmer {
          to {
            background-position: -200% 0;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .boot-bone {
            animation: none;
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
